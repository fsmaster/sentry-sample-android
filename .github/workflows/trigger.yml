name: trigger

# Started by the playground dashboard (or by hand from the Actions tab).
# Builds the release APK, uploads the ProGuard mapping, runs the app on an
# emulator and lets it send one error to Sentry.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "id that goes into the event (tag + message)"
        default: "manual"
      fresh:
        description: "new issue for this run (fingerprint)"
        default: "true"
  push:
    branches: [main]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      RUN_ID: ${{ inputs.run_id || format('push-{0}', github.run_number) }}
      FRESH: ${{ inputs.fresh || 'true' }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - name: Build release APK (uploads mapping + sources to Sentry)
        run: ./gradlew assembleRelease --console=plain

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n com.fsmaster.sentrysample/.MainActivity --es run_id "$RUN_ID" --ez fresh "$FRESH"
            sleep 15
            adb logcat -d -s SentrySample:I
